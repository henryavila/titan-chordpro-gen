/*
 * Atomic Skills product docs — shared design-system tokens.

/* ─────────────────────────────────────────────────────────────────────
   aiDeck Design System — Foundations (v2)
   Dark default. Light is a second palette on the same token names.

   Tokens are intentionally domain-agnostic — `status-success` not
   `phase-done`, `chart-1..8` not `verifier-shell`.
   ───────────────────────────────────────────────────────────────────── */

/* Fonts — Inter (sans) + JetBrains Mono (identifiers). System stacks fall
   back when webfonts are unavailable (offline-friendly). */

:root {
  color-scheme: dark;

  /* ── Surfaces ───────────────────────────────────────────────── */
  --bg-sunken:      #07090d;   /* inputs, code blocks, deepest wells */
  --bg-canvas:      #0a0d12;   /* page background */
  --bg-surface:     #12161d;   /* widget cards, section panels */
  --bg-elevated:    #1a1f28;   /* hover, popovers, dropdowns */
  --bg-overlay:     #232936;   /* selected rows, focus halos */
  --bg-highlight:   #2d3340;   /* highest — used sparingly */

  /* ── Glass ──────────────────────────────────────────────────── */
  --glass-thin:     rgba(18, 22, 29, 0.55);
  --glass-medium:   rgba(18, 22, 29, 0.72);
  --glass-thick:    rgba(10, 13, 18, 0.85);
  --glass-border:   rgba(255, 255, 255, 0.06);
  --glass-blur:     saturate(180%) blur(20px);
  --glass-blur-sm:  saturate(160%) blur(10px);

  /* ── Borders ────────────────────────────────────────────────── */
  --border-subtle:  #1a2029;
  --border-default: #262d38;
  --border-strong:  #3d4656;
  --border-bright:  #555f72;

  /* ── Foreground ─────────────────────────────────────────────── */
  --fg-default:     #e9eef5;   /* primary text — body, headings */
  --fg-muted:       #98a1ad;   /* secondary — captions, labels */
  --fg-subtle:      #6b7585;   /* tertiary — metadata */
  --fg-faint:       #424a5a;   /* lowest — disabled */
  --fg-on-accent:   #08090d;   /* text on saturated chip fill */

  /* ── Semantic status ────────────────────────────────────────── */
  --status-success: #4cc28e;   /* emerald   — passed, done, healthy */
  --status-warning: #e0a44a;   /* amber     — needs attention, blocked */
  --status-error:   #ff5c5c;   /* coral red — failed, critical, broken */
  --status-info:    #5fb1ff;   /* azure     — active, running, current */
  --status-neutral: #8b95a3;   /* slate     — idle, pending, unknown */

  --status-success-bg: color-mix(in srgb, var(--status-success) 14%, var(--bg-surface));
  --status-warning-bg: color-mix(in srgb, var(--status-warning) 14%, var(--bg-surface));
  --status-error-bg:   color-mix(in srgb, var(--status-error)   16%, var(--bg-surface));
  --status-info-bg:    color-mix(in srgb, var(--status-info)    14%, var(--bg-surface));
  --status-neutral-bg: var(--bg-elevated);

  --status-success-line: color-mix(in srgb, var(--status-success) 42%, var(--border-default));
  --status-warning-line: color-mix(in srgb, var(--status-warning) 42%, var(--border-default));
  --status-error-line:   color-mix(in srgb, var(--status-error)   48%, var(--border-default));
  --status-info-line:    color-mix(in srgb, var(--status-info)    42%, var(--border-default));
  --status-neutral-line: var(--border-default);

  /* ── Accents ────────────────────────────────────────────────── */
  --accent-primary: var(--status-info);
  --accent-focus:   #88c4ff;
  --accent-link:    #88c4ff;

  /* ── Typography stacks ──────────────────────────────────────── */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono",
               "Menlo", "Consolas", monospace;
  --font-display: var(--font-sans);

  /* ── Type scale ─────────────────────────────────────────────── */
  --fs-2xs: 10px;
  --fs-xs:  11px;
  --fs-sm:  12px;
  --fs-base:13px;
  --fs-md:  14px;
  --fs-lg:  16px;
  --fs-xl:  20px;
  --fs-2xl: 24px;
  --fs-3xl: 32px;
  --fs-4xl: 40px;
  --fs-5xl: 56px;

  --lh-tight:  1.15;
  --lh-snug:   1.35;
  --lh-normal: 1.5;
  --lh-relaxed:1.65;

  --tracking-tight:  -0.015em;
  --tracking-normal: 0;
  --tracking-wide:   0.04em;
  --tracking-wider:  0.08em;

  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;

  /* ── Spacing (4px base) ─────────────────────────────────────── */
  --space-0:  0;
  --space-1:  2px;
  --space-2:  4px;
  --space-3:  6px;
  --space-4:  8px;
  --space-5:  10px;
  --space-6:  12px;
  --space-7:  14px;
  --space-8:  16px;
  --space-10: 20px;
  --space-12: 24px;
  --space-14: 28px;
  --space-16: 32px;
  --space-20: 40px;
  --space-24: 48px;
  --space-32: 64px;

  /* ── Radii ──────────────────────────────────────────────────── */
  --radius-none: 0;
  --radius-xs:   2px;
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   8px;
  --radius-xl:   12px;
  --radius-2xl:  16px;
  --radius-pill: 999px;

  --border-width: 1px;

  /* ── Elevation ──────────────────────────────────────────────── */
  --highlight-inset:        inset 0 1px 0 rgba(255, 255, 255, 0.045);
  --highlight-inset-strong: inset 0 1px 0 rgba(255, 255, 255, 0.075);
  --shadow-sm:      0 2px 4px -2px rgba(0, 0, 0, 0.5),
                    var(--highlight-inset);
  --shadow-md:      0 8px 24px -8px rgba(0, 0, 0, 0.6),
                    0 2px 6px -2px rgba(0, 0, 0, 0.4),
                    var(--highlight-inset);
  --shadow-focus:   0 0 0 2px var(--bg-canvas),
                    0 0 0 4px var(--accent-focus);
}

@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) {
    color-scheme: light;

    --bg-sunken:      #e8edf4;
    --bg-canvas:      #f4f6fa;
    --bg-surface:     #ffffff;
    --bg-elevated:    #eef2f7;
    --bg-overlay:     #e2e8f0;
    --bg-highlight:   #d8dee8;

    --glass-thin:     rgba(255, 255, 255, 0.55);
    --glass-medium:   rgba(255, 255, 255, 0.78);
    --glass-thick:    rgba(244, 246, 250, 0.9);
    --glass-border:   rgba(15, 23, 42, 0.08);

    --border-subtle:  #e8edf3;
    --border-default: #d5dce6;
    --border-strong:  #b8c2d0;
    --border-bright:  #8b97a8;

    --fg-default:     #12161d;
    --fg-muted:       #4a5565;
    --fg-subtle:      #6b7585;
    --fg-faint:       #98a1ad;
    --fg-on-accent:   #ffffff;

    --accent-focus:   #1565c0;
    --accent-link:    #1565c0;

    --highlight-inset:        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    --highlight-inset-strong: inset 0 1px 0 rgba(255, 255, 255, 0.95);
    --shadow-sm:      0 1px 2px rgba(15, 23, 42, 0.06),
                      0 1px 3px rgba(15, 23, 42, 0.04);
    --shadow-md:      0 8px 24px -8px rgba(15, 23, 42, 0.12),
                      0 2px 6px -2px rgba(15, 23, 42, 0.08);
  }
}

html[data-theme="dark"] {
  color-scheme: dark;
}

html[data-theme="light"] {
  color-scheme: light;

  --bg-sunken:      #e8edf4;
  --bg-canvas:      #f4f6fa;
  --bg-surface:     #ffffff;
  --bg-elevated:    #eef2f7;
  --bg-overlay:     #e2e8f0;
  --bg-highlight:   #d8dee8;

  --glass-thin:     rgba(255, 255, 255, 0.55);
  --glass-medium:   rgba(255, 255, 255, 0.78);
  --glass-thick:    rgba(244, 246, 250, 0.9);
  --glass-border:   rgba(15, 23, 42, 0.08);

  --border-subtle:  #e8edf3;
  --border-default: #d5dce6;
  --border-strong:  #b8c2d0;
  --border-bright:  #8b97a8;

  --fg-default:     #12161d;
  --fg-muted:       #4a5565;
  --fg-subtle:      #6b7585;
  --fg-faint:       #98a1ad;
  --fg-on-accent:   #ffffff;

  --accent-focus:   #1565c0;
  --accent-link:    #1565c0;

  --highlight-inset:        inset 0 1px 0 rgba(255, 255, 255, 0.85);
  --highlight-inset-strong: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  --shadow-sm:      0 1px 2px rgba(15, 23, 42, 0.06),
                    0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-md:      0 8px 24px -8px rgba(15, 23, 42, 0.12),
                    0 2px 6px -2px rgba(15, 23, 42, 0.08);
}

/* ── Base ─────────────────────────────────────────────────────────── */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-canvas);
  color: var(--fg-default);
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--accent-link);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

code,
pre,
.mono {
  font-family: var(--font-mono);
  font-feature-settings: "calt" 0;
}

code {
  font-size: 0.92em;
  background: var(--bg-sunken);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.1em 0.35em;
}

pre {
  margin: 0;
  padding: var(--space-8);
  background: var(--bg-sunken);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  overflow-x: auto;
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

pre code {
  background: transparent;
  border: 0;
  padding: 0;
  font-size: inherit;
}

/* ── Layout chrome for product docs ───────────────────────────────── */

.site-shell {
  max-width: 960px;
  margin: 0 auto;
  padding: var(--space-12) var(--space-10) var(--space-24);
}

.site-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-8);
  margin-bottom: var(--space-16);
  padding-bottom: var(--space-10);
  border-bottom: 1px solid var(--border-default);
}

.site-brand {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  color: var(--fg-default);
  text-decoration: none;
}

.site-brand:hover {
  text-decoration: none;
}

.site-brand-title {
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-tight);
}

.site-brand-sub {
  font-size: var(--fs-xs);
  color: var(--fg-subtle);
  font-family: var(--font-mono);
}

.site-nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.site-nav a {
  display: inline-flex;
  align-items: center;
  height: 30px;
  padding: 0 var(--space-6);
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  color: var(--fg-muted);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  text-decoration: none;
}

.site-nav a:hover {
  color: var(--fg-default);
  background: var(--bg-elevated);
  text-decoration: none;
}

.site-nav a.active {
  color: var(--status-info);
  background: var(--status-info-bg);
  border-color: var(--status-info-line);
}

.site-header-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-6);
}

.theme-switch {
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-pill);
  background: var(--bg-elevated);
  overflow: hidden;
}

.theme-switch button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--fg-muted);
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  height: 28px;
  padding: 0 var(--space-5);
  cursor: pointer;
}

.theme-switch button[aria-checked="true"] {
  background: var(--bg-surface);
  color: var(--fg-default);
}

.theme-switch button:focus-visible {
  outline: none;
  box-shadow: var(--shadow-focus);
}

.site-main {
  display: flex;
  flex-direction: column;
  gap: var(--space-12);
}

.site-footer {
  margin-top: var(--space-24);
  padding-top: var(--space-10);
  border-top: 1px solid var(--border-default);
  color: var(--fg-subtle);
  font-size: var(--fs-sm);
}

h1, h2, h3 {
  margin: 0;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  font-weight: var(--fw-semibold);
}

h1 {
  font-size: var(--fs-3xl);
}

h2 {
  font-size: var(--fs-xl);
  margin-top: var(--space-4);
}

h3 {
  font-size: var(--fs-lg);
}

.lede {
  margin: 0;
  color: var(--fg-muted);
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  max-width: 68ch;
}

.section {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  padding: var(--space-10) var(--space-12);
  box-shadow: var(--shadow-sm);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--space-8);
}

.card a.card-title {
  color: var(--fg-default);
  font-weight: var(--fw-semibold);
  text-decoration: none;
}

.card a.card-title:hover {
  color: var(--accent-link);
  text-decoration: underline;
}

.card .one-liner {
  margin: var(--space-4) 0 0;
  color: var(--fg-muted);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.iron-law {
  margin-top: var(--space-6);
  padding: var(--space-4) var(--space-6);
  background: color-mix(in srgb, var(--status-warning) 10%, var(--bg-surface));
  border: 1px solid var(--status-warning-line);
  border-radius: var(--radius-md);
  color: var(--status-warning);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
}

.badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 var(--space-5);
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  font-weight: var(--fw-medium);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}

.badge-tested {
  background: var(--status-success-bg);
  border-color: var(--status-success-line);
  color: var(--status-success);
}

.badge-theoretical {
  background: var(--status-neutral-bg);
  border-color: var(--status-neutral-line);
  color: var(--fg-muted);
}

.badge-module {
  background: var(--status-info-bg);
  border-color: var(--status-info-line);
  color: var(--status-info);
}

ul.plain {
  margin: 0;
  padding-left: 1.2em;
  color: var(--fg-muted);
}

ul.plain li + li {
  margin-top: var(--space-3);
}

.meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-4);
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  background: var(--bg-surface);
}

table.docs {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sm);
}

table.docs th,
table.docs td {
  padding: var(--space-6) var(--space-8);
  text-align: left;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: top;
}

table.docs th {
  color: var(--fg-subtle);
  font-weight: var(--fw-medium);
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
  background: var(--bg-elevated);
}

table.docs tr:last-child td {
  border-bottom: 0;
}

table.docs td {
  color: var(--fg-default);
}

.eyebrow {
  font-size: var(--fs-2xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--fg-subtle);
}

.install-block {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.back-link {
  font-size: var(--fs-sm);
  color: var(--fg-muted);
}

.prose p {
  margin: 0;
  color: var(--fg-muted);
  max-width: 70ch;
  line-height: var(--lh-relaxed);
}

.prose p + p {
  margin-top: var(--space-6);
}

.list-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin: 0;
  padding: 0;
  list-style: none;
}

.list-stack li {
  padding: var(--space-6) var(--space-8);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
}

.list-stack .cmd {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--status-info);
}

.list-stack .desc {
  margin-top: var(--space-2);
  color: var(--fg-muted);
  font-size: var(--fs-sm);
}

.footnote {
  color: var(--fg-subtle);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
  max-width: 70ch;
}

/* ── Project guide spine ────────────────────────────────────────────── */

ol.spine {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: var(--space-4);
  margin: 0;
  padding: 0;
  list-style: none;
}

.spine-step {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 7.5rem;
  max-width: 11rem;
  flex: 1 1 7.5rem;
  padding: var(--space-6) var(--space-6);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  position: relative;
}

.spine-label {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-wide);
  color: var(--status-info);
}

.spine-note {
  font-size: var(--fs-2xs);
  color: var(--fg-muted);
  line-height: var(--lh-snug);
}

.spine-arrow {
  display: none;
}

.list-stack .cmd-args {
  margin-left: var(--space-2);
  color: var(--fg-subtle);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}

<script>
(function(){
var MIN=0.3,MAX=2.8,PREFIX="as-flow-zoom:";
var PDF_DIAGRAM_STYLE="svg{--bg-sunken:#e8edf4;--bg-canvas:#f4f6fa;--bg-surface:#ffffff;--bg-elevated:#eef2f7;--border-subtle:#e8edf3;--border-default:#d5dce6;--fg-default:#12161d;--fg-muted:#4a5565;--fg-subtle:#6b7585;--fg-faint:#98a1ad;--status-success:#4cc28e;--status-warning:#e0a44a;--status-error:#ff5c5c;--status-info:#5fb1ff;--status-success-line:#9bd1c1;--status-warning-line:#dac4a4;--status-error-line:#e99fa4;--status-info-line:#a3caf0;--font-sans:\"Inter\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;--font-mono:\"JetBrains Mono\", ui-monospace, \"SF Mono\", \"Menlo\", \"Consolas\", monospace}svg.diagram{display:block;max-width:none;font-family:var(--font-sans);shape-rendering:geometricPrecision;text-rendering:geometricPrecision}\nsvg.diagram text{fill:var(--fg-default)}\n.actor-box{fill:var(--bg-elevated);stroke:var(--border-default);stroke-width:1}\n.actor-label{fill:var(--fg-default);font-size:11px;font-weight:600}\n.actor-stick-bg{fill:var(--bg-surface)}\n.actor-stick-rule{stroke:var(--border-default);stroke-width:1}\n.lifeline{stroke:var(--fg-faint);stroke-width:1;stroke-dasharray:3 5;pointer-events:none}\n.life-hit{stroke:transparent;stroke-width:20;fill:none}\n.arrow{stroke:var(--fg-muted);stroke-width:1.25;fill:none}\n.arrow.async{stroke-dasharray:5 4}\n.arrow-head{fill:var(--fg-muted)}\n.msg{fill:var(--fg-default);font-size:12px}\n.xor-wash{fill:color-mix(in srgb,var(--bg-elevated) 18%,transparent);stroke:none}\n.xor-rail{stroke:var(--status-warning-line);stroke-width:2;fill:none}\n.xor-q{fill:var(--status-warning);font-size:12px;font-weight:600}\n.hair{stroke:var(--border-subtle);stroke-width:1}\n.pill{fill:var(--bg-sunken);stroke:var(--status-warning-line);stroke-width:1}\n.pill-t{fill:var(--status-warning);font-size:11px;font-weight:600}\n.loop-arc{fill:none;stroke:var(--status-warning);stroke-width:1.25;stroke-dasharray:4 3}\n.loop-head{fill:var(--status-warning)}\n.act{fill:var(--bg-elevated);stroke:var(--border-default);stroke-width:1.25}\n.act-t{fill:var(--fg-default);font-size:12px;font-weight:500}\n.who{fill:var(--fg-subtle);font-size:10px;font-family:var(--font-mono)}\n.diamond{fill:color-mix(in srgb,var(--status-warning) 10%,var(--bg-surface));stroke:var(--status-warning-line);stroke-width:1.25}\n.xor-t{fill:var(--fg-default);font-size:12px;font-weight:600}\n.bar{fill:var(--fg-muted)}\n.evt{fill:var(--bg-canvas);stroke:var(--status-error-line);stroke-width:1.5}\n.sub-mark{fill:none;stroke:var(--border-default);stroke-width:1}\n.edge{stroke:var(--fg-faint);stroke-width:1.15;fill:none}\n.edge.back{stroke:var(--status-warning);stroke-dasharray:4 3}\n.edge-head{fill:var(--fg-muted)}\n.edge-head.back{fill:var(--status-warning)}\n.edge-t{fill:var(--fg-muted);font-size:11px}\n.end-ok{fill:var(--status-success);stroke:var(--status-success);stroke-width:1.5}\n.end-bad{fill:var(--status-error);stroke:var(--status-error);stroke-width:1.5}\n.end-t{fill:var(--fg-muted);font-size:11px}\n.end-hole{fill:var(--bg-canvas)}\n.st{fill:var(--bg-sunken);stroke:var(--border-default);stroke-width:1.15}\n.st.entry{stroke:var(--status-info);stroke-width:1.75}\n.st.term{stroke:var(--status-success);stroke-width:1.75}\n.st-t{fill:var(--fg-default);font-size:12px;font-weight:500}\n.mach-title{fill:var(--fg-muted);font-size:12px;font-weight:600}\n.mach-legend{fill:var(--fg-subtle);font-size:10px}\n.edge-cap{fill:var(--bg-surface);stroke:var(--border-default);stroke-width:1}\n.edge-title{fill:var(--fg-default);font-size:11px;font-weight:600}\n.fx{fill:var(--fg-subtle);font-size:10px;font-family:var(--font-sans)}\n.fx-pill{fill:var(--bg-sunken);stroke:var(--border-default);stroke-width:1}\n.fx-pill-t{fill:var(--fg-muted);font-size:9px;font-weight:600}\n.xor-wash{fill:rgba(238,242,247,0.18);stroke:none}\n.diamond{fill:#fcf6ed;stroke:var(--status-warning-line);stroke-width:1.25}\n";
var slug=document.documentElement.getAttribute("data-fl-slug")||"default";
var key=PREFIX+slug;
var viewport=document.getElementById("fl-viewport");
var sizer=document.getElementById("fl-sizer");
var stage=document.getElementById("fl-stage");
var lab=document.getElementById("z-lab");
var scale=1;
function readZoom(){
  try{
    var n=parseFloat(localStorage.getItem(key));
    if(Number.isFinite(n)) return Math.min(MAX,Math.max(MIN,n));
  }catch(e){}
  return 1;
}
function saveZoom(){try{localStorage.setItem(key,String(scale))}catch(e){}}
function visiblePanel(){return document.querySelector(".fl-surface:not([hidden])")}
function visibleSvg(){
  var p=visiblePanel();
  return p?p.querySelector("svg"):null;
}
function svgNative(svg){
  if(!svg) return {w:0,h:0};
  if(!svg.dataset.nw){
    var vb=svg.viewBox&&svg.viewBox.baseVal;
    svg.dataset.nw=String((vb&&vb.width)||0);
    svg.dataset.nh=String((vb&&vb.height)||0);
  }
  return {w:+svg.dataset.nw,h:+svg.dataset.nh};
}
function applySvgScale(){
  var svg=visibleSvg();
  if(!svg) return;
  var n=svgNative(svg);
  svg.setAttribute("width",String(n.w*scale));
  svg.setAttribute("height",String(n.h*scale));
}
function applyStageGeometry(){
  applySvgScale();
  var sheet=document.querySelector(".fl-surface:not([hidden]) .sheet");
  if(!sheet||!viewport||!sizer||!stage) return null;
  var w=sheet.offsetWidth,h=sheet.offsetHeight,pad=40;
  var contentW=w+pad*2,contentH=h+pad*2;
  sizer.style.width=Math.max(viewport.clientWidth,Math.ceil(contentW))+"px";
  sizer.style.height=Math.max(viewport.clientHeight,Math.ceil(contentH))+"px";
  var sizerW=Math.max(viewport.clientWidth,Math.ceil(contentW));
  stage.style.left=Math.max(0,(sizerW-contentW)/2)+"px";
  stage.style.top="0px";
  if(lab) lab.textContent=Math.round(scale*100)+"%";
  return {contentW:contentW};
}
function setScale(next){
  scale=Math.min(MAX,Math.max(MIN,next));
  applyStageGeometry();
  saveZoom();
}
function selectTab(name){
  var tabs=document.querySelectorAll('[role="tab"][data-tab]');
  var i=0;
  for(;i<tabs.length;i++){
    var t=tabs[i];
    var on=t.getAttribute("data-tab")===name;
    t.setAttribute("aria-selected",on?"true":"false");
    var panel=document.getElementById(t.getAttribute("aria-controls"));
    if(!panel) continue;
    if(on) panel.removeAttribute("hidden");
    else panel.setAttribute("hidden","");
  }
  applyStageGeometry();
}
var toc=document.querySelector(".fl-toc");
if(toc) toc.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");
  if(!t||t.hidden) return;
  selectTab(t.getAttribute("data-tab"));
});
function pdfFilename(slug){
  var s=String(slug||"").trim().replace(/[^a-zA-Z0-9._-]+/g,"-").replace(/^-+|-+$/g,"");
  return s?s+"-fluxo.pdf":"fluxo.pdf";
}
function enc(s){return new TextEncoder().encode(s)}
function concat(chunks){
  var n=0,i=0;
  for(;i<chunks.length;i++) n+=chunks[i].length;
  var out=new Uint8Array(n),o=0;
  for(i=0;i<chunks.length;i++){out.set(chunks[i],o);o+=chunks[i].length}
  return out;
}
function buildFlowPdf(input){
  var list=Array.isArray(input&&input.pages)?input.pages:[];
  if(!list.length) throw new Error("buildFlowPdf: pages required");
  var header=enc("%PDF-1.4\n%\x80\x80\x80\x80\n");
  var bodyParts=[],offsets=[0],pos=header.length;
  function pushObj(num,payload){
    var start=enc(num+" 0 obj\n"),end=enc("\nendobj\n");
    offsets[num]=pos;
    var chunk=concat([start,payload,end]);
    bodyParts.push(chunk);
    pos+=chunk.length;
  }
  var n=list.length,kids=list.map(function(_,i){return (3+i*3)+" 0 R"}).join(" ");
  pushObj(1,enc("<< /Type /Catalog /Pages 2 0 R >>"));
  pushObj(2,enc("<< /Type /Pages /Kids [ "+kids+" ] /Count "+n+" >>"));
  list.forEach(function(p,i){
    var pageNo=3+i*3,contentNo=pageNo+1,imageNo=pageNo+2;
    var ptW=Number(p.ptWidth)||Number(p.width)||595;
    var ptH=Number(p.ptHeight)||Number(p.height)||842;
    var raw=p.jpeg;
    var jpeg=raw instanceof Uint8Array?raw:new Uint8Array(raw);
    var pxW=Math.max(1,Number(p.width)||1),pxH=Math.max(1,Number(p.height)||1);
    var content="q "+ptW+" 0 0 "+ptH+" 0 0 cm /Im0 Do Q";
    pushObj(pageNo,enc("<< /Type /Page /Parent 2 0 R /MediaBox [ 0 0 "+ptW+" "+ptH+" ] /Resources << /XObject << /Im0 "+imageNo+" 0 R >> >> /Contents "+contentNo+" 0 R >>"));
    pushObj(contentNo,enc("<< /Length "+content.length+" >>\nstream\n"+content+"\nendstream"));
    pushObj(imageNo,concat([enc("<< /Type /XObject /Subtype /Image /Width "+pxW+" /Height "+pxH+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n"),jpeg,enc("\nendstream")]));
  });
  var xrefStart=pos,maxObj=2+n*3,xref="xref\n0 "+(maxObj+1)+"\n0000000000 65535 f \n",i;
  for(i=1;i<=maxObj;i++) xref+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  return concat([header].concat(bodyParts).concat([enc(xref),enc("trailer\n<< /Size "+(maxObj+1)+" /Root 1 0 R >>\nstartxref\n"+xrefStart+"\n%%EOF\n")]));
}
function svgForPdf(svg){
  var clone=svg.cloneNode(true);
  clone.removeAttribute("id");
  var style=document.createElementNS("http://www.w3.org/2000/svg","style");
  style.setAttribute("data-fl-pdf","1");
  style.textContent=PDF_DIAGRAM_STYLE;
  clone.insertBefore(style,clone.firstChild);
  return clone;
}
function svgToJpeg(svg){
  return new Promise(function(resolve,reject){
    var vb=svg.viewBox&&svg.viewBox.baseVal;
    var w=(vb&&vb.width)||svg.width.baseVal.value||1;
    var h=(vb&&vb.height)||svg.height.baseVal.value||1;
    var xml=new XMLSerializer().serializeToString(svgForPdf(svg));
    if(xml.indexOf('xmlns="http://www.w3.org/2000/svg"')<0){
      xml=xml.replace(/^<svg/,'<svg xmlns="http://www.w3.org/2000/svg"');
    }
    var blob=new Blob([xml],{type:"image/svg+xml;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(w*2));
      canvas.height=Math.max(1,Math.round(h*2));
      var ctx=canvas.getContext("2d");
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(function(b){
        if(!b){reject(new Error("jpeg"));return}
        b.arrayBuffer().then(function(buf){
          resolve({jpeg:new Uint8Array(buf),width:canvas.width,height:canvas.height,ptWidth:539,ptHeight:539*(canvas.height/canvas.width)});
        }).catch(reject);
      },"image/jpeg",0.92);
    };
    img.onerror=function(){URL.revokeObjectURL(url);reject(new Error("svg"))};
    img.src=url;
  });
}
async function downloadPdf(btn){
  if(btn.disabled) return;
  btn.disabled=true;
  var prev=btn.textContent;
  btn.textContent="PDF…";
  try{
    var ids=["seq-svg","bpm-svg","mach-svg"],pages=[],i;
    for(i=0;i<ids.length;i++){
      var svg=document.getElementById(ids[i]);
      if(svg) pages.push(await svgToJpeg(svg));
    }
    if(!pages.length) throw new Error("Nenhum diagrama para exportar");
    var bytes=buildFlowPdf({pages:pages});
    var url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    var name=btn.getAttribute("data-pdf-name")||pdfFilename(document.documentElement.getAttribute("data-fl-slug")||"");
    var a=document.createElement("a");
    a.href=url;a.download=name;a.click();
    setTimeout(function(){URL.revokeObjectURL(url)},60000);
  }catch(err){
    var hint=document.getElementById("fl-hint");
    if(hint) hint.appendChild(document.createTextNode(" "+((err&&err.message)||"Falha ao gerar PDF")));
  }finally{
    btn.disabled=false;
    btn.textContent=prev||"PDF";
  }
}
var bar=document.querySelector(".fl-toolbar");
if(bar) bar.addEventListener("click",function(e){
  var pdf=e.target.closest("[data-action=pdf]");
  if(pdf){downloadPdf(pdf);return}
  var b=e.target.closest("[data-zoom]");
  if(!b) return;
  var a=b.getAttribute("data-zoom");
  if(a==="in") setScale(scale+0.1);
  else if(a==="out") setScale(scale-0.1);
  else if(a==="height"||a==="width"){
    var n=svgNative(visibleSvg());
    if(!n.w||!n.h||!viewport) return;
    var fitX=(viewport.clientWidth-24)/(n.w+80);
    var fitY=(viewport.clientHeight-24)/(n.h+80);
    setScale(a==="height"?fitY:fitX);
  } else {
    setScale(1);
  }
});
if(viewport){
  var panning=false,px=0,py=0,sx=0,sy=0;
  viewport.addEventListener("pointerdown",function(e){
    if(e.button!==0) return;
    panning=true;px=e.clientX;py=e.clientY;sx=viewport.scrollLeft;sy=viewport.scrollTop;
    viewport.classList.add("is-panning");
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener("pointermove",function(e){
    if(!panning) return;
    viewport.scrollLeft=sx-(e.clientX-px);
    viewport.scrollTop=sy-(e.clientY-py);
  });
  function endPan(){panning=false;viewport.classList.remove("is-panning")}
  viewport.addEventListener("pointerup",endPan);
  viewport.addEventListener("pointercancel",endPan);
  viewport.addEventListener("wheel",function(e){
    if(!e.ctrlKey) return;
    e.preventDefault();
    setScale(scale+(e.deltaY<0?0.1:-0.1));
  },{passive:false});
}
scale=readZoom();
applyStageGeometry();
window.addEventListener("resize",applyStageGeometry);
})();
