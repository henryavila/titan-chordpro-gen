[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titan-chordpro-lib"
version = "0.1.0a0"
description = "Audio-to-ChordPro Python library with chord-on-syllable placement"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Henry Ávila", email = "personal@henryavila.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
titan-chordpro = "titan_chordpro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["titan_chordpro"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: pipeline tests with mocks",
    "corpus_quick: corpus tests on 30s snippets (CI)",
    "corpus_full: full-song corpus tests (nightly only)",
    "benchmark: validation harness against full catalog (manual)",
]
testpaths = ["tests"]
