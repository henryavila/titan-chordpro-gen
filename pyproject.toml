[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titan-chordpro-gen"
version = "0.1.0c0"
description = "Audio-to-ChordPro generator with chord-on-syllable placement"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Henry Ávila", email = "personal@henryavila.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
]

# Apple Silicon (M-series) fast paths — installs PyTorch with MPS support
# plus the universal engines (whisper.cpp, htdemucs via audio-separator,
# BeatThis, Chordino Python bindings).
mac = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "audio-separator>=0.17",
    "pywhispercpp>=1.2",
    "beat-this @ git+https://github.com/CPJKU/beat_this.git@main",
    "chord-extractor>=0.1.3,<0.2",
    "gruut[pt-br]>=2.3",
    "g2p_en>=2.1",
    "librosa>=0.10",
]

# CUDA fast paths — same engines, CUDA-capable PyTorch build is installed
# separately by the user via the official PyTorch index URL.
cuda = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "audio-separator>=0.17",
    "pywhispercpp>=1.2",
    "beat-this @ git+https://github.com/CPJKU/beat_this.git@main",
    "chord-extractor>=0.1.3,<0.2",
    "gruut[pt-br]>=2.3",
    "g2p_en>=2.1",
    "librosa>=0.10",
]

# Audio-analysis engines only — beat/downbeats (BeatThis), stem separation
# (htdemucs via audio-separator), transcription (whisper.cpp) and torchaudio
# alignment. NO chord/lyric stack (chord-extractor/gruut/g2p), so a consumer
# that only needs music analysis (e.g. curta's beat-sync / mood) can depend on
# this without the Vamp/Chordino host or the pt-br lexicons. Subset of [mac].
audio = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "librosa>=0.10",
    "beat-this @ git+https://github.com/CPJKU/beat_this.git@main",
    "audio-separator>=0.17",
    "pywhispercpp>=1.2",
]

# Validation harness against the iasdermelinda corpus (Tier 2 / Tier 3).
# Decoupled from [mac]/[cuda] so a CI runner can install validation without
# pulling the full ML stack (yt-dlp + mir_eval do not need GPU).
validation = [
    "yt-dlp>=2024.8.6",
    "mir_eval>=0.7",
    "librosa>=0.10",   # bass-note chroma analysis (F-004)
    "scipy>=1.13",     # signal processing helpers used by metrics
    "rich>=13.7",      # CLI progress bars (T71)
]

[project.scripts]
titan-chordpro-gen = "titan_chordpro.cli:main"
titan-chordpro = "titan_chordpro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["titan_chordpro"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.extra-build-dependencies]
# vamp's source dist doesn't declare numpy as a build dep; tell uv.
vamp = ["numpy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional ML deps — not installed in [dev]; engines import lazily.
module = [
    "torch",
    "torch.*",
    "torchaudio",
    "torchaudio.*",
    "beat_this",
    "beat_this.*",
    "audio_separator",
    "audio_separator.*",
    "pywhispercpp",
    "pywhispercpp.*",
    "chord_extractor",
    "chord_extractor.*",
    "gruut",
    "gruut.*",
    "g2p_en",
    "librosa",
    "librosa.*",
    "soundfile",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: pipeline tests with mocks",
    "corpus_quick: corpus tests on 30s snippets (CI)",
    "corpus_full: full-song corpus tests (nightly only)",
    "benchmark: validation harness against full catalog (manual)",
]
testpaths = ["tests"]
