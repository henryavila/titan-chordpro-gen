[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titan-chordpro-lib"
version = "0.1.0b1"
description = "Audio-to-ChordPro Python library with chord-on-syllable placement"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Henry Ávila", email = "personal@henryavila.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
]

# Apple Silicon (M-series) fast paths — installs PyTorch with MPS support
# plus the universal engines (whisper.cpp, htdemucs via audio-separator,
# BeatThis, Chordino Python bindings).
mac = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "python-audio-separator>=0.17",
    "pywhispercpp>=1.2",
    "beat-this @ git+https://github.com/CPJKU/beat_this.git@main",
    "chord-extractor>=0.1.3,<0.2",
    "gruut[pt-br]>=2.3",
    "g2p_en>=2.1",
    "librosa>=0.10",
]

# CUDA fast paths — same engines, CUDA-capable PyTorch build is installed
# separately by the user via the official PyTorch index URL.
cuda = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "python-audio-separator>=0.17",
    "pywhispercpp>=1.2",
    "beat-this @ git+https://github.com/CPJKU/beat_this.git@main",
    "chord-extractor>=0.1.3,<0.2",
    "gruut[pt-br]>=2.3",
    "g2p_en>=2.1",
    "librosa>=0.10",
]

[project.scripts]
titan-chordpro = "titan_chordpro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["titan_chordpro"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional ML deps — not installed in [dev]; engines import lazily.
module = [
    "torch",
    "torch.*",
    "torchaudio",
    "torchaudio.*",
    "beat_this",
    "beat_this.*",
    "audio_separator",
    "audio_separator.*",
    "pywhispercpp",
    "pywhispercpp.*",
    "chord_extractor",
    "chord_extractor.*",
    "gruut",
    "gruut.*",
    "g2p_en",
    "librosa",
    "librosa.*",
    "soundfile",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: pipeline tests with mocks",
    "corpus_quick: corpus tests on 30s snippets (CI)",
    "corpus_full: full-song corpus tests (nightly only)",
    "benchmark: validation harness against full catalog (manual)",
]
testpaths = ["tests"]
